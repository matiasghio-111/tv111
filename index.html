<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Rutinas del Gimnasio</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
  }
  #pantalla {
    width: 100vw;
    height: 100vh;
    object-fit: contain; /* cambiar a "cover" si tus diseños ya tienen el aspect ratio exacto de la TV */
    display: block;
  }
</style>
</head>
<body>

<img id="pantalla" src="" alt="rutina">

<script>
/* ============================================================
   1) LAS IMÁGENES SE SIRVEN DESDE EL PROPIO GITHUB
   ------------------------------------------------------------
   Estas rutas apuntan a la carpeta "images" dentro de este mismo
   repositorio (matiasghio-111/tv111, rama main).

   PARA ACTUALIZAR CADA SEMANA:
   - Entrás a la carpeta "images" en GitHub
   - Subís los archivos nuevos con EXACTAMENTE el mismo nombre
   - GitHub te pregunta si querés reemplazarlos -> confirmás
   - El link NUNCA cambia (a diferencia de Dropbox), así que
     no hace falta tocar este archivo nunca más para esto.
   ============================================================ */

const REPO_BASE = "https://raw.githubusercontent.com/matiasghio-111/tv111/main/images/";

const CONFIG = {
  "funcional-lunes.jpg":       REPO_BASE + "funcional-lunes.jpg",
  "musculacion-lunes.jpg":     REPO_BASE + "musculacion-lunes.jpg",
  "funcional-martes.jpg":      REPO_BASE + "funcional-martes.jpg",
  "musculacion-martes.jpg":    REPO_BASE + "musculacion-martes.jpg",
  "funcional-miercoles.jpg":   REPO_BASE + "funcional-miercoles.jpg",
  "musculacion-miercoles.jpg": REPO_BASE + "musculacion-miercoles.jpg",
  "funcional-jueves.jpg":      REPO_BASE + "funcional-jueves.jpg",
  "musculacion-jueves.jpg":    REPO_BASE + "musculacion-jueves.jpg",
  "funcional-viernes.jpg":     REPO_BASE + "funcional-viernes.jpg",
  "stretching-viernes.jpg":    REPO_BASE + "stretching-viernes.jpg",
  "funcional-sabado.jpg":      REPO_BASE + "funcional-sabado.jpg",
  "logo.jpg":                  REPO_BASE + "logo.jpg",
  "logo-noche.jpg":            REPO_BASE + "logo-noche.jpg"
};

/* ============================================================
   2) HORARIOS (esto ya está armado según tu grilla, no toques)
   dia: 0=domingo, 1=lunes, 2=martes, 3=miercoles, 4=jueves,
        5=viernes, 6=sabado
   inicio/fin en formato 24hs (numero)
   ============================================================ */

const EVENTOS = [
  // Domingo (cerrado todo el día -> logo noche)
  {dia:0, inicio:0,  fin:24, img:"logo-noche.jpg"},

  // Lunes
  {dia:1, inicio:0,  fin:7,  img:"logo-noche.jpg"},
  {dia:1, inicio:7,  fin:10, img:"funcional-lunes.jpg"},
  // (12:00 musculación eliminada -> queda como logo normal por defecto)
  {dia:1, inicio:17, fin:18, img:"musculacion-lunes.jpg"},
  {dia:1, inicio:18, fin:20, img:"funcional-lunes.jpg"},
  {dia:1, inicio:20, fin:21, img:"musculacion-lunes.jpg"},
  {dia:1, inicio:22, fin:24, img:"logo-noche.jpg"},

  // Martes
  {dia:2, inicio:0,  fin:7,  img:"logo-noche.jpg"},
  {dia:2, inicio:7,  fin:10, img:"funcional-martes.jpg"},
  {dia:2, inicio:17, fin:18, img:"musculacion-martes.jpg"},
  {dia:2, inicio:18, fin:20, img:"funcional-martes.jpg"},
  {dia:2, inicio:20, fin:21, img:"musculacion-martes.jpg"},
  {dia:2, inicio:22, fin:24, img:"logo-noche.jpg"},

  // Miercoles
  {dia:3, inicio:0,  fin:7,  img:"logo-noche.jpg"},
  {dia:3, inicio:7,  fin:10, img:"funcional-miercoles.jpg"},
  {dia:3, inicio:17, fin:18, img:"musculacion-miercoles.jpg"},
  {dia:3, inicio:18, fin:20, img:"funcional-miercoles.jpg"},
  {dia:3, inicio:20, fin:21, img:"musculacion-miercoles.jpg"},
  {dia:3, inicio:22, fin:24, img:"logo-noche.jpg"},

  // Jueves
  {dia:4, inicio:0,  fin:7,  img:"logo-noche.jpg"},
  {dia:4, inicio:7,  fin:10, img:"funcional-jueves.jpg"},
  {dia:4, inicio:17, fin:18, img:"musculacion-jueves.jpg"},
  {dia:4, inicio:18, fin:20, img:"funcional-jueves.jpg"},
  {dia:4, inicio:20, fin:21, img:"musculacion-jueves.jpg"},
  {dia:4, inicio:22, fin:24, img:"logo-noche.jpg"},

  // Viernes
  {dia:5, inicio:0,  fin:7,  img:"logo-noche.jpg"},
  {dia:5, inicio:7,  fin:10, img:"funcional-viernes.jpg"},
  {dia:5, inicio:12, fin:13, img:"stretching-viernes.jpg"},
  {dia:5, inicio:17, fin:20, img:"funcional-viernes.jpg"},
  {dia:5, inicio:22, fin:24, img:"logo-noche.jpg"},

  // Sabado
  {dia:6, inicio:0,  fin:7,  img:"logo-noche.jpg"},
  {dia:6, inicio:9,  fin:11, img:"funcional-sabado.jpg"},
  {dia:6, inicio:14, fin:24, img:"logo-noche.jpg"}
];

/* ============================================================
   3) LÓGICA (no hace falta tocar nada de acá para abajo)
   ============================================================ */

let imgActualMostrada = null;

function imagenCorrespondiente() {
  const ahora = new Date();
  const dia = ahora.getDay();
  const horaDecimal = ahora.getHours() + ahora.getMinutes() / 60;

  const evento = EVENTOS.find(e =>
    e.dia === dia && horaDecimal >= e.inicio && horaDecimal < e.fin
  );

  return evento ? evento.img : "logo.jpg";
}

function actualizarPantalla() {
  const nombreImg = imagenCorrespondiente();

  if (nombreImg === imgActualMostrada) return; // ya está mostrando lo correcto, no parpadea

  const url = CONFIG[nombreImg];
  if (!url || url === "PEGAR_LINK_AQUI") {
    console.warn("Falta configurar el link de: " + nombreImg);
    return;
  }

  // cache-busting: fuerza a que se refresque una vez por día
  const fecha = new Date().toISOString().slice(0,10);
  const separador = url.includes("?") ? "&" : "?";
  document.getElementById("pantalla").src = url + separador + "cb=" + fecha;
  imgActualMostrada = nombreImg;
}

actualizarPantalla();
setInterval(actualizarPantalla, 20000); // revisa cada 20 segundos
</script>

</body>
</html>
